name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm test

      - name: Security source check
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --exclude-dir=.git -Ei "(service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY)" .
          grep -q "Content-Security-Policy" vercel.json
          grep -q "escapeHtml" app.js

      - name: Required routes check
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'/admin'" app.js
          grep -q "'/showroom'" app.js
          grep -q "'/team'" app.js
          grep -q "'/login'" app.js
