name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Syntax and production build
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security source check
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --exclude-dir=.git --exclude-dir=node_modules --exclude=package-lock.json -Ei "(service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY)" .
          grep -q "Content-Security-Policy" vercel.json
          grep -q "escapeHtml" app.js
          grep -q "Strict-Transport-Security" vercel.json

      - name: Required routes check
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'/admin'" app.js
          grep -q "'/showroom'" app.js
          grep -q "'/team'" app.js
          grep -q "'/login'" app.js

      - name: Build output check
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
